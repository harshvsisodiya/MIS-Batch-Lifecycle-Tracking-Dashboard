{% extends "base.html" %}
{% block title %}New Batch{% endblock %}
{% block content %}
  <h2>Add New Batch</h2>
  <div class="panel" style="max-width: 420px;">
    <form method="post">
      <label>Batch / Task Name</label>
      <input type="text" name="name" required placeholder="e.g. Batch-2026-014">

      <label>Owner</label>
      <input type="text" name="owner" required placeholder="e.g. Priya Nair">

      <label>SOP Deadline (days from creation)</label>
      <input type="number" name="sop_deadline_days" value="7" min="1">

      <div style="margin-top: 18px;">
        <button type="submit">Create Batch</button>
      </div>
    </form>
  </div>
{% endblock %}
